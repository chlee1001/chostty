name: Upstream check

# Reports what upstream Ghostty changed and how much of it lands on code this
# fork rewrote. It never merges: the fork's whole risk is a merge git resolves
# happily while restoring behaviour the fork removed, and only a human reading
# the review list catches that.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with upstream is the sync point, so the full
          # history has to be here for git to find it.
          fetch-depth: 0

      - name: Analyze
        id: analyze
        run: |
          ./scripts/upstream-sync.sh --markdown > report.md
          if grep -q '^Up to date' report.md; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
          cat report.md

      - name: Open or update the tracking issue
        if: steps.analyze.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream Ghostty has moved"
          # One rolling issue. A new one per run would bury the review list
          # under duplicates nobody reads.
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          {
            echo "Generated by \`scripts/upstream-sync.sh\`. Run it locally for the same report."
            echo
            cat report.md
          } > body.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "updated #$existing"
          else
            gh issue create --title "$title" --body-file body.md
          fi
