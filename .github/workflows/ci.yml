name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # shellcheck is preinstalled on the Ubuntu image and absent from the macOS
  # one. Linting shell here costs seconds instead of a brew install inside the
  # long macOS job.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck macos/scripts/*.sh scripts/*.sh

  macos:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Building GhosttyKit accounts for roughly 12 of the 16 minutes in this
      # job. Its output only changes when Zig/core inputs change, so macOS-only
      # pull requests can reuse the last matching framework.
      #
      # `zig-out/share` is cached with it because the Xcode target copies
      # terminfo, shell completions and the man pages straight out of that
      # directory. Caching only the framework skips the Zig build that also
      # produces those resources, and the app target then fails to copy them.
      - name: Cache GhosttyKit
        id: ghosttykit
        uses: actions/cache@v4
        with:
          path: |
            macos/GhosttyKit.xcframework
            zig-out/share
          key: ghosttykit-debug-share-macos26-${{ runner.arch }}-zig0.16-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'pkg/**', 'vendor/**') }}

      # The native-tab audit is pure text analysis, so run it before the long
      # build. It is the gate that keeps AppKit's window tabbing from creeping
      # back in, and it fails in seconds when it fails.
      - name: Native tab audit
        run: ./macos/scripts/native-tab-audit.sh

      - name: Build GhosttyKit
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: zig build -Demit-macos-app=false

      # UI tests need accessibility permissions no CI runner grants, so the
      # test plan skips them here exactly as macos/build.nu does locally.
      #
      # One test is skipped, not because it fails an assertion but because it
      # takes the test host down with it: it is the only case that finalizes a
      # lease and then builds a fresh live surface, and on a hosted runner that
      # combination exits the process, after which xcodebuild reports every
      # remaining test as failed. It passes locally and stays part of the local
      # gate. Skipping by name means a second such test fails CI rather than
      # disappearing into a pattern.
      #
      # Parallel testing is off because the runner cannot afford it. Every
      # suite that builds a real TerminalController stands up a Ghostty.App
      # with windows and a Metal surface; run concurrently on a hosted VM the
      # test host exits mid-run and xcodebuild reports every unfinished test as
      # a failure, which looks like a broad regression rather than one dead
      # process. Serial execution is slower and reports honestly.
      - name: Test
        run: |
          xcodebuild \
            -project macos/Ghostty.xcodeproj \
            -scheme Ghostty \
            -configuration Debug \
            -skip-testing GhosttyUITests \
            -skip-testing:GhosttyTests/DuplicateTabAndReopenClosedTabTests/reopenAfterForcedFinalizeCreatesFreshTabWithRecordedMetadata\(\) \
            -parallel-testing-enabled NO \
            SYMROOT="$PWD/macos/build" \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
