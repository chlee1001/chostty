name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version for a test build (no release is published)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  macos:
    # Matches the Xcode this fork is developed against. The project builds
    # against the macOS 26 SDK; an older image fails at compile time rather
    # than producing a working older-SDK build.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # zig build derives a version from git when one is not passed, and
          # the packaging step records the commit.
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          # zig parses this as a semantic version and the build fails late if
          # it does not; reject it here where the error is readable.
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || {
            echo "not a semantic version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          zig version

      # GhosttyKit is the Zig core the Swift app links against. Upstream builds
      # this inside a Nix shell; on a GitHub runner plain Zig plus the Xcode
      # SDK is enough, and it produces the universal slice on its own.
      - name: Build GhosttyKit
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string=${{ steps.v.outputs.version }}

      - name: Build Chostty.app
        run: |
          xcodebuild \
            -project macos/Ghostty.xcodeproj \
            -scheme Ghostty \
            -configuration Release \
            SYMROOT="$PWD/macos/build" \
            build

      - name: Package
        run: |
          ./macos/scripts/package-release.sh \
            --app macos/build/Release/Chostty.app \
            --version ${{ steps.v.outputs.version }} \
            --commit ${{ steps.v.outputs.commit }} \
            --build ${{ github.run_number }} \
            --out dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: chostty-macos-universal
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          body: |
            ## Install

            Open the DMG and drag Chostty to Applications, then run:

            ```
            xattr -cr /Applications/Chostty.app
            ```

            **That step is required, not a suggestion.** This fork has no Apple
            Developer ID, so the app is ad-hoc signed and cannot be notarized.
            macOS quarantines the download and reports it as damaged until the
            attribute is cleared. Skipping it looks exactly like a broken build.

            There is no auto-updater. Sparkle is compiled out because pointing
            it at upstream's appcast would replace this fork with stock
            Ghostty. Check back here for new versions.

            Universal binary, macOS 13 and later.
