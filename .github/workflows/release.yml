name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version for a test build (no release is published)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  macos:
    # Matches the Xcode this fork is developed against. The project builds
    # against the macOS 26 SDK; an older image fails at compile time rather
    # than producing a working older-SDK build.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          v="${{ inputs.version }}"
          # zig parses this as a semantic version and the build fails late if
          # it does not; reject it here where the error is readable.
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || {
            echo "not a semantic version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `zig-out/share` is cached with the framework because the Xcode target
      # copies terminfo, shell completions and the man pages out of it. A
      # framework-only cache skips the Zig build that produces them and the app
      # target then fails to copy them into the bundle.
      - name: Cache GhosttyKit
        id: ghosttykit
        uses: actions/cache@v4
        with:
          path: |
            macos/GhosttyKit.xcframework
            zig-out/share
          key: ghosttykit-releasefast-share-macos26-${{ runner.arch }}-zig0.16-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'pkg/**', 'vendor/**') }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          zig version

      # GhosttyKit is the Zig core the Swift app links against. Upstream builds
      # this inside a Nix shell; on a GitHub runner plain Zig plus the Xcode
      # SDK is enough, and it produces the universal slice on its own.
      - name: Build GhosttyKit
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string=${{ steps.v.outputs.version }}

      - name: Build Chostty.app
        run: |
          xcodebuild \
            -project macos/Ghostty.xcodeproj \
            -scheme Ghostty \
            -configuration Release \
            SYMROOT="$PWD/macos/build" \
            build

      - name: Package
        run: |
          ./macos/scripts/package-release.sh \
            --app macos/build/Release/Chostty.app \
            --version ${{ steps.v.outputs.version }} \
            --commit ${{ steps.v.outputs.commit }} \
            --build ${{ github.run_number }} \
            --out dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: chostty-macos-universal
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

